<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <!-- the app only has a dark look, and saying so before the stylesheet arrives keeps it from flashing white -->
    <meta name="color-scheme" content="dark"/>
    <title>Altis</title>
    <!-- Bootstrap and its icons are compiled into styles.scss and shipped with the app, so it looks right offline -->
    <link data-trunk rel="copy-dir" href="node_modules/bootstrap-icons/font/fonts"/>
    <link data-trunk href="styles.scss" rel="scss"/>
</head>
<body></body>
</html>
